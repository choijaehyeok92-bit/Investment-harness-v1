version: "1.0"
score_total: 100
categories:
  structural_change_and_leadership:
    max_score: 15
    questions:
      - Is the industry structurally expanding?
      - Is the company merely benefiting from change, or actively driving it?
      - Can the company expand the market itself?
      - Is it defining a category or changing competitive standards?
      - Is there a credible path to leadership in a much larger market in 5-10 years?
    anchors:
      "13-15": "Clear leader directly driving structural change"
      "10-12": "Strong beneficiary and credible leader"
      "7-9": "Growth market but competitive structure unclear"
      "4-6": "Structural growth versus cyclicality unclear"
      "0-3": "Structurally stagnant or shrinking"

  customer_value_and_product:
    max_score: 10
    questions:
      - Does the product reduce customer cost?
      - Does it raise customer revenue or productivity?
      - Is it materially better than alternatives?
      - Does switching away impose meaningful loss or friction?
      - Can price rise while customer value remains attractive?

  moat_trajectory:
    max_score: 15
    primary_question: "Will this company's moat be wider in five years than it is today?"
    indicators:
      - market_share_direction
      - customer_retention
      - pricing_power
      - network_effects
      - scale_economies
      - data_advantage
      - brand
      - ecosystem
      - switching_costs
      - rnd_productivity

  incremental_roic_and_fcf_per_share:
    max_score: 15
    questions:
      - Can new capital be reinvested at high returns?
      - Can the company cross-sell more products to existing customers?
      - Do unit costs decline with scale?
      - Does R&D repeatedly open new economic opportunities?
      - Is long-term FCF per share increasing?
      - Is dilution controlled during growth?

  management_and_capital_allocation:
    max_score: 10
    indicators:
      - rnd_outcomes
      - acquisition_price_and_outcomes
      - debt_use
      - sbc_and_dilution
      - repurchase_price_discipline
      - willingness_to_exit_failed_projects
      - talent_retention
      - reinvestment_vs_shareholder_returns
      - honesty_and_transparency

  financial_survivability:
    max_score: 10
    indicators:
      - cash_and_liquidity
      - net_debt
      - debt_maturity
      - gross_margin
      - operating_leverage
      - dependence_on_external_financing
      - sbc_and_dilution
      - recession_fcf_resilience
    loss_making_company_rule: "Allowed only if path to profitability and runway without external capital are clear"

  expectation_gap_and_valuation:
    max_score: 15
    required_scenarios:
      - bear
      - base
      - bull
    mandatory_test: "Reverse-engineer what revenue growth, margin, market share and duration current price requires"
    reject_condition: "Current price requires unrealistic bull-case-or-better execution"

  power_law_and_asymmetry:
    max_score: 10
    questions:
      - What is plausible permanent loss if wrong?
      - How many times can enterprise/equity value increase if right?
      - Is expected value attractive after failure probability?
      - Is there a realistic path to a much larger company in 5-10 years?

classification:
  "90-100": "Exceptional Outlier"
  "85-89": "Core Outlier"
  "75-84": "Emerging Outlier"
  "65-74": "Starter / Watch"
  "0-64": "Reject"

rules:
  - "Score never overrides a Hard Veto"
  - "Every score requires evidence, counter-evidence and confidence"
  - "Unknown evidence must reduce confidence rather than be guessed"
